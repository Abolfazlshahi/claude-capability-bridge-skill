<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
<title id="title">Claude Capability Bridge architecture</title><desc id="desc">Model, provider gateway, agent runtime, tools and real world verification loop.</desc>
<defs><linearGradient id="g1" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="g2" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs>
<rect width="1400" height="420" rx="28" fill="#08111e"/><text x="70" y="68" fill="#fff" font-family="Inter,Arial" font-size="34" font-weight="800">Custom Provider → Agent Runtime → Verified State</text>
<g font-family="Inter,Arial"><rect x="70" y="135" width="240" height="150" rx="20" fill="#11162a" stroke="#8b5cf6" stroke-width="2"/><text x="190" y="185" text-anchor="middle" fill="#ddd6fe" font-size="23" font-weight="700">Third-Party Model</text><text x="190" y="220" text-anchor="middle" fill="#9ca3af" font-size="17">Reasoning</text><text x="190" y="248" text-anchor="middle" fill="#9ca3af" font-size="17">Tool-calling ability</text>
<rect x="400" y="135" width="270" height="150" rx="20" fill="#0d1a2b" stroke="#06b6d4" stroke-width="2"/><text x="535" y="178" text-anchor="middle" fill="#a5f3fc" font-size="23" font-weight="700">Provider Gateway</text><text x="535" y="213" text-anchor="middle" fill="#9ca3af" font-size="17">API translation</text><text x="535" y="241" text-anchor="middle" fill="#9ca3af" font-size="17">ANTHROPIC_BASE_URL</text><text x="535" y="269" text-anchor="middle" fill="#9ca3af" font-size="17">Protocol compatibility</text>
<rect x="760" y="115" width="280" height="190" rx="20" fill="#0d1d26" stroke="#22c55e" stroke-width="2"/><text x="900" y="160" text-anchor="middle" fill="#bbf7d0" font-size="23" font-weight="700">Claude-like Runtime</text><text x="900" y="197" text-anchor="middle" fill="#9ca3af" font-size="17">Skills • Tools • MCP</text><text x="900" y="225" text-anchor="middle" fill="#9ca3af" font-size="17">Files • Browser • Code</text><text x="900" y="253" text-anchor="middle" fill="#9ca3af" font-size="17">Permissions • Context</text><text x="900" y="281" text-anchor="middle" fill="#86efac" font-size="15">The Skill improves procedure, not runtime power</text>
<rect x="1130" y="135" width="200" height="150" rx="20" fill="#19130b" stroke="#f59e0b" stroke-width="2"/><text x="1230" y="182" text-anchor="middle" fill="#fde68a" font-size="23" font-weight="700">Real World</text><text x="1230" y="218" text-anchor="middle" fill="#9ca3af" font-size="17">Browser / Files</text><text x="1230" y="246" text-anchor="middle" fill="#9ca3af" font-size="17">Services / UI</text><text x="1230" y="274" text-anchor="middle" fill="#fcd34d" font-size="15">Evidence</text></g>
<g stroke="url(#g1)" stroke-width="8" fill="none"><path d="M310 210H400"/><path d="M670 210H760"/></g><path d="M1040 210H1130" stroke="url(#g2)" stroke-width="8"/>
<path d="M1230 330 C 1230 385, 170 385, 170 330" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="10 8"/><text x="700" y="370" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Arial" font-size="19">Observe → Verify → Update State → Decide Next Step</text>
