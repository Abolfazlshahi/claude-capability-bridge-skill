<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glowTL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#D97757" stroke-width="0.6" opacity="0.06"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="#141210"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <ellipse cx="120" cy="60" rx="320" ry="220" fill="url(#glowTL)"/>
  <ellipse cx="1080" cy="255" rx="340" ry="220" fill="url(#glowBR)"/>

  <!-- scattered texture dots -->
  <g fill="#D97757">
    <circle cx="60" cy="40" r="1.4" opacity="0.35"/>
    <circle cx="95" cy="90" r="1" opacity="0.25"/>
    <circle cx="40" cy="150" r="1.4" opacity="0.3"/>
    <circle cx="200" cy="55" r="1" opacity="0.2"/>
    <circle cx="1140" cy="40" r="1.4" opacity="0.3"/>
    <circle cx="1100" cy="90" r="1" opacity="0.25"/>
    <circle cx="1150" cy="150" r="1.4" opacity="0.3"/>
    <circle cx="1000" cy="55" r="1" opacity="0.2"/>
    <circle cx="600" cy="30" r="1" opacity="0.18"/>
    <circle cx="500" cy="270" r="1.2" opacity="0.2"/>
    <circle cx="700" cy="275" r="1.2" opacity="0.2"/>
  </g>

  <!-- border frame -->
  <rect x="1" y="1" width="1198" height="298" rx="14" fill="none" stroke="#D97757" stroke-width="1" opacity="0.25"/>

  <!-- left satellite constellation (ANY MODEL) -->
  <g stroke="#D97757" stroke-width="1" opacity="0.45">
    <line x1="160" y1="250" x2="70" y2="120"/>
    <line x1="160" y1="250" x2="55" y2="205"/>
    <line x1="160" y1="250" x2="120" y2="70"/>
  </g>
  <rect x="60" y="110" width="20" height="20" rx="4" fill="none" stroke="#D97757" stroke-width="2" opacity="0.8"/>
  <circle cx="55" cy="205" r="9" fill="none" stroke="#D97757" stroke-width="2" opacity="0.8"/>
  <path d="M111 61 L129 61 L120 79 Z" fill="none" stroke="#D97757" stroke-width="2" opacity="0.8"/>

  <!-- right satellite constellation (CLAUDE RUNTIME: browser / mcp / code) -->
  <g stroke="#D97757" stroke-width="1" opacity="0.45">
    <line x1="1040" y1="250" x2="1130" y2="120"/>
    <line x1="1040" y1="250" x2="1145" y2="205"/>
    <line x1="1040" y1="250" x2="1080" y2="70"/>
  </g>
  <rect x="1118" y="108" width="24" height="18" rx="3" fill="none" stroke="#D97757" stroke-width="2" opacity="0.8"/>
  <line x1="1118" y1="115" x2="1142" y2="115" stroke="#D97757" stroke-width="1.5" opacity="0.8"/>
  <polygon points="1145,205 1155,213 1145,221 1135,213" fill="none" stroke="#D97757" stroke-width="2" opacity="0.8"/>
  <path d="M1073 62 l-7 8 7 8 M1087 62 l7 8 -7 8" fill="none" stroke="#D97757" stroke-width="2" opacity="0.8"/>

  <!-- bridge arc glow + crisp line -->
  <path d="M 160 250 C 400 150 800 150 1040 250" fill="none" stroke="#D97757" stroke-width="10" opacity="0.35" filter="url(#soft)"/>
  <path d="M 160 250 C 400 150 800 150 1040 250" fill="none" stroke="#D97757" stroke-width="3.5" stroke-linecap="round"/>

  <!-- step nodes along the arc -->
  <circle cx="380" cy="178" r="5" fill="#F0A585"/>
  <circle cx="600" cy="158" r="5" fill="#F0A585"/>
  <circle cx="820" cy="178" r="5" fill="#F0A585"/>

  <!-- endpoint nodes with glow -->
  <circle cx="160" cy="250" r="18" fill="#D97757" opacity="0.25" filter="url(#soft)"/>
  <circle cx="1040" cy="250" r="18" fill="#D97757" opacity="0.25" filter="url(#soft)"/>
  <circle cx="160" cy="250" r="9" fill="#D97757"/>
  <circle cx="1040" cy="250" r="9" fill="#D97757"/>

  <!-- title -->
  <text x="600" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="46" font-weight="700" fill="#FAF9F5" letter-spacing="0.5">
    Claude Capability Bridge
  </text>
  <text x="600" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="17" fill="#B7AF9C" letter-spacing="0.3">
    Teaching non-Claude models how Claude's tools actually work
  </text>

  <!-- endpoint labels -->
  <text x="160" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="12" fill="#8A8375" letter-spacing="1.5">ANY MODEL</text>
  <text x="1040" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="12" fill="#8A8375" letter-spacing="1.5">CLAUDE RUNTIME</text>
</svg>
