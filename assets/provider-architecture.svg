<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
<title id="title">Custom provider architecture</title><desc id="desc">Claude Desktop or Claude Code connects to an agent runtime, an Anthropic-compatible API or gateway, and a third-party model, with tools and environment around the runtime.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAF9F5"/><stop offset="1" stop-color="#F3F0E8"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D97757"/><stop offset=".5" stop-color="#6A9BCC"/><stop offset="1" stop-color="#788C5D"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56544F"/></marker></defs>
<rect width="1400" height="520" rx="30" fill="url(#bg)" stroke="#D9D3C8" stroke-width="2"/>
<text x="70" y="68" fill="#141413" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800">Custom-provider architecture</text>
<text x="70" y="102" fill="#56544F" font-family="Inter,Arial,sans-serif" font-size="18">The Skill sits in the procedural layer. Changing the endpoint does not turn a third-party model into an Anthropic model.</text>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
 <g transform="translate(55 160)"><rect width="245" height="190" rx="24" fill="#FFF4EF" stroke="#D97757" stroke-width="2"/><text x="122" y="56" fill="#D97757" font-size="22" font-weight="800">Desktop / Code</text><text x="122" y="90" fill="#141413" font-size="17">host UI</text><text x="122" y="116" fill="#141413" font-size="17">sessions</text><text x="122" y="142" fill="#141413" font-size="17">permissions</text><text x="122" y="168" fill="#6B6860" font-size="14">product surface</text></g>
 <g transform="translate(355 160)"><rect width="245" height="190" rx="24" fill="#EEF4FB" stroke="#6A9BCC" stroke-width="2"/><text x="122" y="56" fill="#426F9D" font-size="22" font-weight="800">Agent Runtime</text><text x="122" y="90" fill="#141413" font-size="17">tools</text><text x="122" y="116" fill="#141413" font-size="17">Skills / MCP</text><text x="122" y="142" fill="#141413" font-size="17">state / dispatch</text><text x="122" y="168" fill="#6B6860" font-size="14">execution semantics</text></g>
 <g transform="translate(655 160)"><rect width="245" height="190" rx="24" fill="#F5F2EE" stroke="#D97757" stroke-width="2"/><text x="122" y="56" fill="#D97757" font-size="22" font-weight="800">API / Gateway</text><text x="122" y="90" fill="#141413" font-size="17">Anthropic-compatible</text><text x="122" y="116" fill="#141413" font-size="17">proxy / adapter</text><text x="122" y="142" fill="#141413" font-size="17">routing</text><text x="122" y="168" fill="#6B6860" font-size="14">transport boundary</text></g>
 <g transform="translate(955 160)"><rect width="245" height="190" rx="24" fill="#F1F4EB" stroke="#788C5D" stroke-width="2"/><text x="122" y="56" fill="#788C5D" font-size="22" font-weight="800">Third-Party Model</text><text x="122" y="90" fill="#141413" font-size="17">tool calling</text><text x="122" y="116" fill="#141413" font-size="17">vision / context</text><text x="122" y="142" fill="#141413" font-size="17">reasoning</text><text x="122" y="168" fill="#6B6860" font-size="14">actual model behavior</text></g>
</g>
<g stroke="#56544F" stroke-width="3" marker-end="url(#arr)"><path d="M300 255h55"/><path d="M600 255h55"/><path d="M900 255h55"/></g>
<path d="M1075 350 C1075 425 425 425 425 350" fill="none" stroke="url(#accent)" stroke-width="4" stroke-dasharray="11 11"/>
<text x="750" y="448" text-anchor="middle" fill="#302F2C" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Observe real behavior → attribute failures to runtime, transport, tooling, or model capability.</text>
<text x="750" y="480" text-anchor="middle" fill="#6B6860" font-family="Inter,Arial,sans-serif" font-size="15">Example: a tool can disappear because endpoint mode changes — that is different from the model seeing it and choosing not to call it.</text>
</svg>
