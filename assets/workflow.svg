<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">Capability Bridge agent workflow</title><desc id="desc">A six-stage loop: discover, select, execute, observe, verify, recover.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b17"/><stop offset="1" stop-color="#111b36"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
<rect width="1400" height="560" rx="30" fill="url(#bg)"/>
<text x="70" y="78" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800">The operating loop</text>
<text x="70" y="114" fill="#9eabc8" font-family="Inter,Arial,sans-serif" font-size="19">A repeatable protocol for turning exposed tools into verified outcomes.</text>
<path d="M170 270 H1230" stroke="url(#line)" stroke-width="5" stroke-dasharray="14 16" opacity=".65"/>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
  <g><circle cx="170" cy="270" r="78" fill="#17152d" stroke="#a78bfa" stroke-width="4"/><text x="170" y="263" fill="#c4b5fd" font-size="18" font-weight="700">1</text><text x="170" y="292" fill="#fff" font-size="23" font-weight="800">DISCOVER</text><text x="170" y="392" fill="#9eabc8" font-size="16">What is actually exposed?</text></g>
  <g><circle cx="382" cy="270" r="78" fill="#102037" stroke="#7dd3fc" stroke-width="4"/><text x="382" y="263" fill="#bae6fd" font-size="18" font-weight="700">2</text><text x="382" y="292" fill="#fff" font-size="23" font-weight="800">SELECT</text><text x="382" y="392" fill="#9eabc8" font-size="16">Which surface fits the job?</text></g>
  <g><circle cx="594" cy="270" r="78" fill="#0f2a28" stroke="#6ee7b7" stroke-width="4"/><text x="594" y="263" fill="#a7f3d0" font-size="18" font-weight="700">3</text><text x="594" y="292" fill="#fff" font-size="23" font-weight="800">EXECUTE</text><text x="594" y="392" fill="#9eabc8" font-size="16">Call it with the live contract.</text></g>
  <g><circle cx="806" cy="270" r="78" fill="#2a2411" stroke="#fcd34d" stroke-width="4"/><text x="806" y="263" fill="#fde68a" font-size="18" font-weight="700">4</text><text x="806" y="292" fill="#fff" font-size="23" font-weight="800">OBSERVE</text><text x="806" y="392" fill="#9eabc8" font-size="16">Capture state, outputs, effects.</text></g>
  <g><circle cx="1018" cy="270" r="78" fill="#102a24" stroke="#34d399" stroke-width="4"/><text x="1018" y="263" fill="#a7f3d0" font-size="18" font-weight="700">5</text><text x="1018" y="292" fill="#fff" font-size="23" font-weight="800">VERIFY</text><text x="1018" y="392" fill="#9eabc8" font-size="16">Did the acceptance criterion pass?</text></g>
  <g><circle cx="1230" cy="270" r="78" fill="#2d1722" stroke="#fb7185" stroke-width="4"/><text x="1230" y="263" fill="#fecdd3" font-size="18" font-weight="700">6</text><text x="1230" y="292" fill="#fff" font-size="23" font-weight="800">RECOVER</text><text x="1230" y="392" fill="#9eabc8" font-size="16">Classify, change, retry, re-verify.</text></g>
</g>
<path d="M1230 488 C1230 525 170 525 170 488" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 12"/>
<text x="700" y="512" text-anchor="middle" fill="#7f8bab" font-family="Inter,Arial,sans-serif" font-size="15">Repeat until the requested real-world state is evidenced — not merely asserted.</text>
</svg>
