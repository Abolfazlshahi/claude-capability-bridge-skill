<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
<title id="title">Before and after the Claude Capability Bridge Skill</title><desc id="desc">A realistic engineering comparison: without the Skill the model may stop at partial success; with it the model discovers, executes and verifies the full task.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAF9F5"/><stop offset="1" stop-color="#F3F0E8"/></linearGradient><linearGradient id="good" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#788C5D"/><stop offset="1" stop-color="#6A9BCC"/></linearGradient></defs>
<rect width="1400" height="600" rx="30" fill="url(#bg)" stroke="#D9D3C8" stroke-width="2"/>
<text x="70" y="70" fill="#141413" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800">Before vs After</text>
<text x="70" y="106" fill="#56544F" font-family="Inter,Arial,sans-serif" font-size="18">Same model · same runtime · same tools · same task — only the procedural layer changes.</text>
<g transform="translate(60 150)">
 <rect width="600" height="355" rx="26" fill="#FFF4EF" stroke="#D97757" stroke-width="2"/>
 <text x="40" y="58" fill="#D97757" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800">WITHOUT THE SKILL</text>
 <g font-family="Inter,Arial,sans-serif" font-size="18">
  <circle cx="44" cy="108" r="12" fill="#D97757"/><text x="72" y="115" fill="#141413">Tool exists, but selection may be skipped.</text>
  <circle cx="44" cy="158" r="12" fill="#D97757"/><text x="72" y="165" fill="#141413">Wrong surface or wrong argument shape.</text>
  <circle cx="44" cy="208" r="12" fill="#D97757"/><text x="72" y="215" fill="#141413">“Server started” becomes “app works.”</text>
  <circle cx="44" cy="258" r="12" fill="#D97757"/><text x="72" y="265" fill="#141413">Partial success can be reported as done.</text>
  <circle cx="44" cy="308" r="12" fill="#D97757"/><text x="72" y="315" fill="#141413">Retries repeat without diagnosis.</text>
 </g>
</g>
<g transform="translate(740 150)">
 <rect width="600" height="355" rx="26" fill="#F2F5ED" stroke="#788C5D" stroke-width="2"/>
 <text x="40" y="58" fill="#788C5D" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800">WITH THE SKILL</text>
 <g font-family="Inter,Arial,sans-serif" font-size="18">
  <circle cx="44" cy="108" r="12" fill="#788C5D"/><text x="72" y="115" fill="#141413">Discovers live capabilities and contracts first.</text>
  <circle cx="44" cy="158" r="12" fill="#788C5D"/><text x="72" y="165" fill="#141413">Selects the narrowest reliable tool/surface.</text>
  <circle cx="44" cy="208" r="12" fill="#6A9BCC"/><text x="72" y="215" fill="#141413">Checks process → port → HTTP → UI.</text>
  <circle cx="44" cy="258" r="12" fill="#6A9BCC"/><text x="72" y="265" fill="#141413">Exercises the critical path and asserts state.</text>
  <circle cx="44" cy="308" r="12" fill="#788C5D"/><text x="72" y="315" fill="#141413">Classifies failures, changes a variable, re-verifies.</text>
 </g>
</g>
<rect x="530" y="535" width="340" height="36" rx="18" fill="url(#good)" opacity=".18"/>
<text x="700" y="559" text-anchor="middle" fill="#141413" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">Expected effect, not measured benchmark data</text>
</svg>
