<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
<title id="title">Before and after the Claude Capability Bridge Skill</title><desc id="desc">A realistic engineering comparison: without the Skill the model may stop at partial success; with it the model discovers, executes and verifies the full task.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b17"/><stop offset="1" stop-color="#151d39"/></linearGradient><linearGradient id="good" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34d399"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
<rect width="1400" height="600" rx="30" fill="url(#bg)"/>
<text x="70" y="70" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800">Before vs After</text>
<text x="70" y="106" fill="#9eabc8" font-family="Inter,Arial,sans-serif" font-size="18">Same model · same runtime · same tools · same task — only the procedural layer changes.</text>
<g transform="translate(60 150)">
 <rect width="600" height="355" rx="26" fill="#1c1017" stroke="#fb7185" stroke-width="2"/>
 <text x="40" y="58" fill="#fecdd3" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800">WITHOUT THE SKILL</text>
 <g font-family="Inter,Arial,sans-serif" font-size="18">
  <circle cx="44" cy="108" r="12" fill="#fb7185"/><text x="72" y="115" fill="#eef2ff">Tool exists, but selection may be skipped.</text>
  <circle cx="44" cy="158" r="12" fill="#fb7185"/><text x="72" y="165" fill="#eef2ff">Wrong surface or wrong argument shape.</text>
  <circle cx="44" cy="208" r="12" fill="#fb7185"/><text x="72" y="215" fill="#eef2ff">"Server started" becomes "app works."</text>
  <circle cx="44" cy="258" r="12" fill="#fb7185"/><text x="72" y="265" fill="#eef2ff">Partial success can be reported as done.</text>
  <circle cx="44" cy="308" r="12" fill="#fb7185"/><text x="72" y="315" fill="#eef2ff">Retries repeat without diagnosis.</text>
 </g>
</g>
<g transform="translate(740 150)">
 <rect width="600" height="355" rx="26" fill="#0d201d" stroke="#34d399" stroke-width="2"/>
 <text x="40" y="58" fill="#a7f3d0" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800">WITH THE SKILL</text>
 <g font-family="Inter,Arial,sans-serif" font-size="18">
  <circle cx="44" cy="108" r="12" fill="#34d399"/><text x="72" y="115" fill="#eef2ff">Discovers live capabilities and contracts first.</text>
  <circle cx="44" cy="158" r="12" fill="#34d399"/><text x="72" y="165" fill="#eef2ff">Selects the narrowest reliable tool/surface.</text>
  <circle cx="44" cy="208" r="12" fill="#34d399"/><text x="72" y="215" fill="#eef2ff">Checks process → port → HTTP → UI.</text>
  <circle cx="44" cy="258" r="12" fill="#34d399"/><text x="72" y="265" fill="#eef2ff">Exercises the critical path and asserts state.</text>
  <circle cx="44" cy="308" r="12" fill="#34d399"/><text x="72" y="315" fill="#eef2ff">Classifies failures, changes a variable, re-verifies.</text>
 </g>
</g>
<rect x="530" y="535" width="340" height="36" rx="18" fill="url(#good)" opacity=".2"/>
<text x="700" y="559" text-anchor="middle" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">Expected effect, not measured benchmark data</text>
</svg>
